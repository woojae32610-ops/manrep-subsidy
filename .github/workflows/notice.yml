# 공지사항(notice.md)만 바뀌었을 때: 수집·요약 없이 사이트만 다시 만들어 바로 배포 (2~3분)
# 쓰는 법: GitHub 에서 notice.md 열어 연필 아이콘 → 수정 → Commit changes
name: notice

on:
  push:
    branches: [main]
    paths: ['notice.md']

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: build site
        run: node src/build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
